name: Apply Broken Halo Institute SEO fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-site-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add SEO metadata, robots, and sitemap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, html

          BASE = "https://brokenhaloco.org"
          OG_IMAGE = "https://thebrokenhaloco.com/book-cover-front.webp?v=20260723"
          SITE_NAME = "Broken Halo Institute"
          ORG_DESC = "Identity-centered recovery education and practical resources grounded in lived experience, clinical discipline, harm reduction, and accountability without humiliation."

          html_files = sorted(Path('.').glob('*.html'))

          for path in html_files:
              text = path.read_text(encoding='utf-8')

              # Remove this managed block if the workflow is run again.
              text = re.sub(
                  r'\n?\s*<!-- BHI SEO START -->.*?<!-- BHI SEO END -->\s*\n?',
                  '\n', text, flags=re.S
              )

              title_match = re.search(r'<title>(.*?)</title>', text, flags=re.I | re.S)
              title = re.sub(r'\s+', ' ', title_match.group(1)).strip() if title_match else SITE_NAME

              desc_match = re.search(
                  r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']\s*/?>',
                  text, flags=re.I | re.S
              )
              description = re.sub(r'\s+', ' ', desc_match.group(1)).strip() if desc_match else ORG_DESC

              if path.name.lower() == 'index.html':
                  canonical = BASE + '/'
              else:
                  canonical = BASE + '/' + path.name

              org = {
                  "@context": "https://schema.org",
                  "@type": "Organization",
                  "@id": BASE + "/#organization",
                  "name": SITE_NAME,
                  "url": BASE + "/",
                  "description": ORG_DESC
              }

              block = f'''\n  <!-- BHI SEO START -->
  <link rel="canonical" href="{html.escape(canonical, quote=True)}">
  <meta name="robots" content="index,follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{SITE_NAME}">
  <meta property="og:title" content="{html.escape(title, quote=True)}">
  <meta property="og:description" content="{html.escape(description, quote=True)}">
  <meta property="og:url" content="{html.escape(canonical, quote=True)}">
  <meta property="og:image" content="{html.escape(OG_IMAGE, quote=True)}">
  <meta property="og:image:alt" content="Broken But Breathing by Eric Lee Sanders — Broken Halo Institute">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{html.escape(title, quote=True)}">
  <meta name="twitter:description" content="{html.escape(description, quote=True)}">
  <meta name="twitter:image" content="{html.escape(OG_IMAGE, quote=True)}">
  <meta name="twitter:image:alt" content="Broken But Breathing by Eric Lee Sanders — Broken Halo Institute">
  <script type="application/ld+json">
  {json.dumps(org, ensure_ascii=False, indent=2)}
  </script>
  <!-- BHI SEO END -->\n'''

              if '</head>' not in text.lower():
                  raise RuntimeError(f'{path} has no </head> tag')

              # Case-insensitive replacement of first closing head tag.
              text = re.sub(r'</head>', block + '</head>', text, count=1, flags=re.I)

              # The audit referenced this incorrect address. Do not publish it anywhere.
              text = text.replace('contact@brokenhaloinstitute.org', '')

              path.write_text(text, encoding='utf-8')

          Path('robots.txt').write_text(
              'User-agent: *\nAllow: /\n\nSitemap: https://brokenhaloco.org/sitemap.xml\n',
              encoding='utf-8'
          )

          urls = []
          for path in html_files:
              if path.name.lower() == 'index.html':
                  urls.append(BASE + '/')
              else:
                  urls.append(BASE + '/' + path.name)

          sitemap = ['<?xml version="1.0" encoding="UTF-8"?>',
                     '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for url in urls:
              sitemap.extend(['  <url>', f'    <loc>{html.escape(url)}</loc>', '  </url>'])
          sitemap.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(sitemap) + '\n', encoding='utf-8')
          PY

      - name: Commit generated site fixes
        shell: bash
        run: |
          if git diff --quiet && [ -f robots.txt ] && [ -f sitemap.xml ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' robots.txt sitemap.xml
          git commit -m "Apply SEO, social preview, sitemap, and structured data fixes"
          git push
